/* ==================================================
   1. BASIC RESET
================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f8f7;
    color: #222;
    line-height: 1.6;
}


/* ==================================================
   NAVIGATION - FLEXBOX
================================================== */

nav {
    background: #064e4e;
    color: white;

    padding: 16px 7%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #7de2c4;
}

nav ul {
    display: flex;
    gap: 25px;
    list-style: none;
}

nav ul li a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

nav ul li a:hover {
    color: #7de2c4;
}


/* ==================================================
   HERO
================================================== */

.hero {
    min-height: 70vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 40px 20px;

    background:
        linear-gradient(
            135deg,
            #064e4e,
            #0b8f87
        );

    color: white;
}

.hero-content {
    max-width: 850px;
}

.hero h1 {
    font-size: 48px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #7de2c4;
}

.hero p {
    font-size: 18px;
    margin: 10px 0;
}

.hero-button {
    display: inline-block;

    margin-top: 25px;

    padding: 12px 25px;

    background: white;
    color: #064e4e;

    text-decoration: none;

    border-radius: 25px;

    font-weight: bold;

    transition: 0.3s;
}

.hero-button:hover {
    transform: translateY(-4px);
}


/* ==================================================
   COMMON SECTION
================================================== */

section {
    padding: 70px 8%;
}

.section-title {
    text-align: center;
    margin-bottom: 40px;
}

.section-title h2 {
    color: #087f78;
    font-size: 32px;
}

.section-title p {
    margin-top: 8px;
    color: #555;
}

   OBJECTIVE
================================================== */

}
