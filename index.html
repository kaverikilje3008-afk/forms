/* ================================
   GLOBAL
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --primary: #00a6a6;
    --secondary: #007f86;
    --bg: #f4f8f8;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
}

body.dark {
    --bg: #101820;
    --card: #17242d;
    --text: #ffffff;
    --muted: #b8c0c5;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

/* ================================
   NAVBAR
================================ */

nav {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 7%;

    background: rgba(0, 128, 134, 0.95);

    color: white;

    backdrop-filter: blur(10px);
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.logo span {
    color: #b9ffff;
}

.nav-links {
    display: flex;
    gap: 25px;
}

.nav-links a {
    color: white;
    text-decoration: none;
    font-weight: bold;
}

.nav-links a:hover {
    color: #b9ffff;
}

.theme-btn {
    background: transparent;
    border: 1px solid white;
    color: white;

    padding: 8px 12px;

    border-radius: 20px;

    cursor: pointer;
}

/* ================================
   HERO
================================ */

.hero {
    min-height: 90vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 40px 20px;

    background:
        linear-gradient(135deg,
        rgba(0,166,166,.15),
        transparent);
}

.hero-content {
    max-width: 800px;
}

.hero h1 {
    font-size: 52px;
    margin-bottom: 15px;
}

.hero h1 span {
    color: var(--primary);
}

.hero p {
    font-size: 19px;
    color: var(--muted);
    margin-bottom: 25px;
}

.btn {
    display: inline-block;

    background: var(--primary);

    color: white;

    padding: 13px 25px;

    border-radius: 30px;

    text-decoration: none;

    border: none;

    cursor: pointer;

    transition: 0.3s;
}

.btn:hover {
    transform: translateY(-3px);
    background: var(--secondary);
}

.clock {
    margin-top: 25px;
    color: var(--muted);
}

/* ================================
   SECTIONS
================================ */

section {
    padding: 80px 7%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 35px;
    color: var(--primary);
}

.section-title p {
    color: var(--muted);
    margin-top: 8px;
}

   SKILLS
================================ */

    display: grid;

    grid-template-columns:

    gap: 25px;
}
